<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TaskFlow - Completed Tasks</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="dashboard-container">

        <!-- Sidebar -->
        <aside class="sidebar">

            <h2 class="logo">TaskFlow</h2>

            <nav class="sidebar-nav">

                <a href="dashboard.html">Dashboard</a>
                <a href="tasks.html">My Tasks</a>
                <a href="pending.html">Pending</a>
                <a href="in-progress.html">In Progress</a>
                <a href="completed.html" class="active">Completed</a>
                <a href="settings.html">Settings</a></nav>

            <a href="index.html" class="logout-link">
                Logout
            </a>

        </aside>


        <!-- Main Content -->
        <main class="dashboard-main">

            <!-- Header -->
            <header class="dashboard-header">

                <div>
                    <h1>Completed Tasks</h1>

                    <p>
                        Here are the tasks you have completed.
                    </p>
                </div>

            </header>


            <!-- Completed Tasks -->
            <section class="tasks-section">

                <div class="tasks-header">

                    <h2>Completed Tasks</h2>

                </div>


                <!-- Completed Task -->
                <div class="task-item">

                    <div class="task-info">

                        <h3>Example Completed Task</h3>

                        <p>
                            This is where your completed tasks will appear.
                        </p>

                    </div>

                    <span class="task-status completed-status">
                        Completed
                    </span>

                </div>

            </section>

        </main>

    </div>

</body>

</html>
